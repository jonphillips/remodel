<div id="kitchen-paired-fit">
  <h2>Kitchen connection comparison</h2>
  <div class="viz-controls">
    <label class="form-label">Operating state
      <select class="form-select" id="kp-state">
        <option value="arrival">Arrival · four guests seated</option>
        <option value="closed">Closed · daily core</option>
        <option value="work">Chef + independent helper</option>
        <option value="dw">Dishwasher loading</option>
        <option value="fridge">Refrigerator access · sensitivity</option>
        <option value="ovens">Wall-oven access · sensitivity</option>
        <option value="serving">Serving · guests remain seated</option>
        <option value="pull">Chair pull-out stress test</option>
      </select>
    </label>
    <label class="form-label">View
      <select class="form-select" id="kp-view"><option value="connection">Kitchen + table connection</option><option value="room">Full context + beverage room inset</option></select>
    </label>
  </div>
  <div class="viz-controls" id="kp-appliance" hidden>
    <label class="form-label">Door projection test <output id="kp-door-value">27″</output>
      <input class="form-range" id="kp-door" type="range" min="18" max="36" step="1" value="27">
    </label>
    <label class="form-label" id="kp-face-label">Oven face Y hypothesis <output id="kp-face-value">−2″</output>
      <input class="form-range" id="kp-face" type="range" min="-10" max="12" step="1" value="-2">
    </label>
  </div>
  <div class="kp-pair">
    <section><h3>P1 · Continuous peninsula</h3><svg id="kp-p" class="kp-plan" role="img" aria-label="Continuous range-side peninsula fit test"></svg></section>
    <section><h3>F1 · Freestanding comparison</h3><svg id="kp-f" class="kp-plan" role="img" aria-label="Identical four-place surface without the range connection"></svg></section>
  </div>
  <div id="kp-readout" aria-live="polite"></div>
  <div class="viz-row text-small kp-legend"><span>Solid outlines: retained study geometry</span><span>Dashed: operating assumptions / route intent</span><span>Numbers: local edge gaps, not verified routes</span></div>
</div>
<style>
#kitchen-paired-fit .kp-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
#kitchen-paired-fit .kp-plan{width:100%;display:block;overflow:visible}
#kitchen-paired-fit .kp-plan text{fill:var(--foreground);font-family:inherit;font-size:12px;font-weight:400}
#kitchen-paired-fit .kp-plan .shape{stroke:var(--foreground);stroke-width:1;fill:var(--muted);fill-opacity:.28}
#kitchen-paired-fit .kp-plan .work{fill:var(--viz-series-1);fill-opacity:.18}
#kitchen-paired-fit .kp-plan .social{fill:var(--viz-series-2);fill-opacity:.18}
#kitchen-paired-fit .kp-plan .link{fill:var(--viz-series-3);fill-opacity:.30}
#kitchen-paired-fit .kp-plan .person{fill:var(--viz-series-4);fill-opacity:.16;stroke-dasharray:4 3}
#kitchen-paired-fit .kp-plan .uncertain{fill:var(--muted);fill-opacity:.12;stroke-dasharray:4 3}
#kitchen-paired-fit .kp-plan .route{fill:none;stroke:var(--viz-series-3);stroke-width:2;stroke-dasharray:5 4}
#kitchen-paired-fit .kp-plan .issue{stroke:var(--destructive);stroke-width:2;fill:none}
#kitchen-paired-fit .kp-plan .dim{stroke:var(--foreground);stroke-width:1;fill:none}
#kitchen-paired-fit .kp-legend{margin-top:12px}
#kitchen-paired-fit [hidden]{display:none!important}
@media(max-width:780px){#kitchen-paired-fit .kp-pair{grid-template-columns:1fr}}
</style>
<script>
(()=>{
const root=document.getElementById('kitchen-paired-fit');
const D=__MODEL_JSON__;
const state=root.querySelector('#kp-state'),view=root.querySelector('#kp-view'),door=root.querySelector('#kp-door'),face=root.querySelector('#kp-face');
const NS='http://www.w3.org/2000/svg';
const R=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function draw(svg,connected){
  svg.replaceChildren(); const mode=state.value,whole=view.value==='room';
  const width=Math.max(280,svg.getBoundingClientRect().width),bounds=whole?[-180,-48,232,370]:[-47,-44,221,372];
  const [xmin,ymin,xmax,ymax]=bounds,pad=12,scale=(width-2*pad)/(xmax-xmin),height=(ymax-ymin)*scale+2*pad;
  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.style.height=height+'px';
  const X=x=>pad+(x-xmin)*scale,Y=y=>pad+(y-ymin)*scale;
  function node(tag,attrs={},parent=svg){const e=document.createElementNS(NS,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
  function poly(points,cl='shape',label){const n=node('polygon',{points:points.map(p=>`${X(p[0])},${Y(p[1])}`).join(' '),class:cl});if(label)node('title',{},n).textContent=label;return n;}
  function line(points,cl='dim'){return node('polyline',{points:points.map(p=>`${X(p[0])},${Y(p[1])}`).join(' '),class:cl});}
  function text(x,y,words,anchor='middle'){const t=node('text',{x:X(x),y:Y(y),'text-anchor':anchor});String(words).split('|').forEach((s,i)=>{node('tspan',{x:X(x),dy:i?'1.2em':0},t).textContent=s});return t;}
  function rect(r,cl='shape',label){return poly(R(...r),cl,label);}
  function dim(metric,label,dx=0,dy=0){if(!metric.segment)return;line(metric.segment,'issue');const [a,b]=metric.segment;text((a[0]+b[0])/2+dx,(a[1]+b[1])/2+dy,label);}
  node('title').textContent=connected?'P1 connected peninsula':'F1 freestanding comparison';
  node('desc').textContent='Same 36 by 66 chef island, 99-inch cleanup, 4 guests at 30 inches each, extended table. Added shaped range-side link only in P1. Dashed operating envelopes are assumptions.';
  // Appliance depths above these fronts are contextual symbols; X widths follow the captured sequence.
  rect([0,-27,29.5,25],'shape uncertain');
  rect([61.5,-27,48,25],'shape uncertain','Refrigerator 48-inch width. Approximate front derived at Y −2.');
  rect([109.5,-27,29.5,25],'shape uncertain','29.5-inch intermediate counter. Face Y unmeasured.');
  rect([139,-27,29.5,25],'shape uncertain','Wall ovens, 29.5-inch width. Face depth unmeasured.');
  text(45.5,-34,'Pantry');text(85.5,-12,'Fridge');text(153.75,-34,'Wall ovens');
  line([[153.75,-31],[153.75,-27]]);
  rect([0,39.5,27.5,24]);poly(D.fixed.range);text(15,80,'Cooktop');text(15,92,'48″');
  poly(D.fixed.landing,'shape work','Protected 36 × 24 range-left mise/hot-pan landing');text(17,122,'Mise');
  poly(D.fixed.island,'shape work');text(96.5,80,'36 × 66');
  rect([99,41.5,11,13],'shape','Existing 13 × 11 prep sink opening retained');
  rect([80.5,62,18,24],'shape work','24 × 18 cutting board');
  poly(D.fixed.cleanup);poly(D.fixed.rear,'shape uncertain');
  rect([159.75,80,19.5,30],'shape','Main sink opening test');
  line([[157,77],[182,77]]);line([[157,113],[182,113]]);text(170,63,'Dirty');text(170,129,'DW');
  text(205,89,'99″|cleanup');line([[192,41],[198,41],[198,140],[192,140]]);
  if(connected)poly(D.connector,'shape link','Shaped shallow continuous link. Proposed surface; support and height unresolved.');
  poly(D.guest,'shape social');poly(D.helper_surface,'shape work');
  rect([84,148,24,18],'shape work','Independent helper board, 24 × 18');rect([108,148,12,18],'shape work','Separate helper landing, 12 × 18');
  if(!whole){text(96,160,'Helper');text(112,179,'4 × 30″');}
  poly(D.stair.tread);poly(D.stair.shaft);poly(D.stair.cap,'shape uncertain','Cap centering remains assumed');text(-18,163,'Stairs');
  // Confirmed X alignment; conditional Y registration, no fabricated porch interior closure.
  line([[5.8247,180],[5.8247,229]],'route');line([[5.8247,229],[5.8247,349]],'dim');
  if(!whole){text(-1,255,'Old porch', 'end');text(-1,267,'beverages', 'end');}
  poly(D.table);text(D.table_center[0],D.table_center[1]-4,'Extended');text(D.table_center[0],D.table_center[1]+9,'table');
  line([[5.8247,D.rear_window_wall_y],[181.5,D.rear_window_wall_y]]);text(86,D.rear_window_wall_y+15,'Window wall');
  line([[144,D.table_center[1]+24],[144,D.rear_window_wall_y]]);text(162,D.rear_window_wall_y-13,'30.5″');
  const chairs=mode==='pull'?D.table_pulled:D.table_chairs;
  chairs.forEach(p=>poly(p,'shape uncertain'));
  const m5=D.points.M5;line([[m5[0],m5[1]+17],m5,[m5[0]+17,m5[1]]]);
  text(204,240,'M5');if(!whole)text(203,253,'New porch');
  if(whole){
    // Dimensioned inset is intentionally separated from registered partition.
    rect([-170,229,161,111],'shape uncertain','161 × 111 inside. Context inset only; interior origin/setback not surveyed.');
    text(-90,266,'Old porch');text(-90,284,'161 × 111 inside');text(-90,302,'Breakfast / beverages');
    text(-90,355,'Inset · exact origin unresolved');
    text(17,241,'52″ tie', 'start');text(17,339,'120″ side','start');
    line([[-50,352],[-50,365]],'route');text(-112,365,'Cooking deck');
    text(205,269,'New giant');text(205,282,'screened');text(205,295,'porch');
  }
  const occupied=['arrival','serving','pull'].includes(mode);
  if(occupied)(mode==='pull'?D.pulled:D.seated).forEach((p,i)=>{poly(p,'shape person');const x=p.reduce((s,q)=>s+q[0],0)/4,y=p.reduce((s,q)=>s+q[1],0)/4;text(x,y,`${i+1}`);});
  if(mode==='closed'||mode==='arrival'){
    dim(D.metrics.east_tip_to_cleanup,'17″',27,1);
    if(!connected)dim(D.metrics.west_gate_bare,'34″',-5,0);
    else {line([[45,139],[55,149]],'issue');line([[45,149],[55,139]],'issue');}
  }
  if(mode==='work'){
    poly(D.fixed.chef,'shape person','Chef standing at range-facing board edge');poly(D.helper_person,'shape person','Independent helper standing envelope');
    line([[62,74],[51,94],[48,111]],'route');
    if(connected)dim(D.metrics.connector_to_island,'35″',-7,-5);
    text(136,113,'24″', 'start');line([[108,104],[108,128]]);
  }
  if(mode==='dw'){
    poly(D.fixed.DWdoor,'shape person','24-inch installed door projection test');poly(D.fixed.DWloader,'shape person','20 × 24 loader assumption');
    text(146,125,'Open');text(122,125,'Load');
    dim(D.metrics.DW_loader_to_social,'11″',-5,2);
    if(connected)line([[181,188],[179,150],[147,148],[135,142]],'route');
  }
  if(mode==='arrival'||mode==='serving'){
    // Intent only. Deliberately retain red bottleneck markers instead of claiming a clear corridor.
    const route=connected?[[10,210],[40,231],[149,231],[187,198],[180,149],[136,148],[123,122],[53,112],[47,16]]:[[10,210],[29,185],[47,150],[52,117],[53,98],[47,16]];
    line(route,'route');
    if(mode==='serving'){
      poly(D.fixed.chef,'shape person');rect([44,144,24,18],'shape person','24 × 18 tray footprint proxy at west approach; not a walking-body clearance');
      if(connected)dim(D.metrics.east_tip_to_cleanup,'17″',27,1);else dim(D.metrics.west_gate_bare,'34″',-5,0);
    }
    if(connected)dim(D.metrics.guest_to_table_chair,D.metrics.guest_to_table_chair.inches.toFixed(1)+'″',-20,1);
  }
  if(mode==='pull')text(118,242,D.metrics.both_chair_sets_pulled.inches.toFixed(1)+'″ gap', 'start');
  if(mode==='fridge'||mode==='ovens'){
    const p=+door.value,ov=mode==='ovens',fy=ov?+face.value:-2,x=ov?139:61.5,w=ov?29.5:48;
    rect([x,fy,w,p],'shape person','Assumed maximum open projection band, not a surveyed appliance sweep');
    const cx=x+w/2;rect([cx-12,fy+p,24,20],'shape person','Centered 24 × 20 operator proxy');
    text(cx,fy+p-5,'Door test');
    text(203,18,'Unverified');
  }
  const bar=whole?[-163,192]:[-35,302];line([[bar[0],bar[1]],[bar[0]+36,bar[1]]]);line([[bar[0],bar[1]-2],[bar[0],bar[1]+2]]);line([[bar[0]+36,bar[1]-2],[bar[0]+36,bar[1]+2]]);text(bar[0]+18,bar[1]-5,'36″');
}
function render(){
  const s=state.value,app=['fridge','ovens'].includes(s);root.querySelector('#kp-appliance').hidden=!app;root.querySelector('#kp-face-label').hidden=s!=='ovens';
  root.querySelector('#kp-door-value').textContent=door.value+'″';root.querySelector('#kp-face-value').textContent=face.value+'″';
  const words={
   closed:'P1 closes the west approach; F1 retains a 34″ local gap. Both have only 17″ at the cleanup-side tip.',
   work:'44″ from island end to helper surface; 24″ behind the standing helper. P1’s added diagonal narrows the island-to-link gap to 35″.',
   dw:'Both: 11″ from loader envelope to helper surface. Loading is possible as a separate activity; through-serving here is restricted.',
   arrival:'P1 redirects arrival around the free end: 17″ tip gap and 35.4″ between assumed occupied chair envelopes. F1 retains the restrictive west approach.',
   serving:'Dashed lines show intended serving routes to the pantry. P1 closes the west route; F1 still shares the range aisle with the chef.',
   pull:'Corrected table: 8.4″ between nearest assumed pull-outs; the rear chair’s 36″ pull-out exceeds its fixed 30.5″ wall gap.',
   fridge:`Approximately 40″ closed fridge-to-island gap − ${door.value}″ projection test = ${40-(+door.value)}″ residual before a person; actual side-by-side door sweep is unmeasured.`,
   ovens:`Oven face Y${face.value} + ${door.value}″ door + 20″ centered user = Y${(+face.value)+(+door.value)+20}; cleanup starts at Y41. Actual oven face and door travel remain unmeasured.`
  };
  root.querySelector('#kp-readout').textContent=words[s];
  draw(root.querySelector('#kp-p'),true);draw(root.querySelector('#kp-f'),false);
}
[state,view,door,face].forEach(e=>e.addEventListener('input',render));
new ResizeObserver(render).observe(root.querySelector('.kp-pair'));render();
})();
</script>
